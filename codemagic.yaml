workflows:
  kwuo-android-debug:
    name: Kwuo Android (debug build)
    max_build_duration: 30
    environment:
      node: 20
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install asset generator
        script: npm install --no-save @capacitor/assets
      - name: Build the web app
        script: |
          echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL" > .env
          echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY" >> .env
          npm run build
      - name: Add Android platform
        script: npx cap add android
      - name: Generate app icon and splash screen
        script: npx capacitor-assets generate --android
      - name: Sync Capacitor
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
